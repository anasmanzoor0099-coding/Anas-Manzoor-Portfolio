<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <pattern id="wv-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#222222" stroke-width="0.75"/>
    </pattern>
    <radialGradient id="wv-signal-1" cx="38%" cy="46%" r="32%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#777777" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wv-signal-2" cx="70%" cy="54%" r="26%">
      <stop offset="0%" stop-color="#E5E5E5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Primary Canvas -->
  <rect width="1200" height="720" fill="#050505"/>
  <rect width="1200" height="720" fill="url(#wv-grid)"/>

  <!-- Header Frame -->
  <rect x="48" y="40" width="1104" height="56" fill="#111111" stroke="#222222" stroke-width="1"/>
  <text x="76" y="73" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="600" letter-spacing="3">WIFIVISION — NETWORK OBSERVATION &amp; TELEMETRY</text>
  <text x="935" y="73" fill="#777777" font-family="monospace" font-size="11" letter-spacing="2">5.0 GHZ / 2.4 GHZ MESH</text>

  <!-- Main Spatial Signal Viewport -->
  <rect x="48" y="116" width="730" height="420" fill="#0A0A0A" stroke="#222222" stroke-width="1"/>
  <circle cx="380" cy="320" r="210" fill="url(#wv-signal-1)"/>
  <circle cx="580" cy="360" r="160" fill="url(#wv-signal-2)"/>

  <!-- Concentric RF Propagation Contours -->
  <g fill="none" stroke="#E5E5E5" stroke-opacity="0.22" stroke-width="1">
    <circle cx="340" cy="310" r="55"/>
    <circle cx="340" cy="310" r="110" stroke-dasharray="4 4"/>
    <circle cx="340" cy="310" r="165" stroke-opacity="0.12"/>
    <circle cx="560" cy="350" r="45"/>
    <circle cx="560" cy="350" r="95" stroke-dasharray="3 5"/>
  </g>

  <!-- Node 01 -->
  <circle cx="340" cy="310" r="6" fill="#FFFFFF"/>
  <circle cx="340" cy="310" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="364" y="306" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">NODE_AP_01 [5GHz]</text>
  <text x="364" y="324" fill="#E5E5E5" font-family="monospace" font-size="11">RSSI: -44 dBm | SNR: 41 dB</text>

  <!-- Node 02 -->
  <circle cx="560" cy="350" r="5" fill="#E5E5E5"/>
  <circle cx="560" cy="350" r="12" fill="none" stroke="#777777" stroke-width="1.2"/>
  <text x="582" y="346" fill="#E5E5E5" font-family="monospace" font-size="12">NODE_AP_02 [2.4GHz]</text>
  <text x="582" y="364" fill="#777777" font-family="monospace" font-size="11">RSSI: -63 dBm | Ch. 06</text>

  <!-- Right Panel: Real-Time Signal Waveform & Kotlin Android Collector -->
  <rect x="802" y="116" width="350" height="420" fill="#111111" stroke="#222222" stroke-width="1"/>
  <text x="830" y="156" fill="#777777" font-family="monospace" font-size="11" letter-spacing="2">OBSERVATION METRICS</text>
  <line x1="830" y1="172" x2="1124" y2="172" stroke="#222222" stroke-width="1"/>

  <text x="830" y="210" fill="#777777" font-family="sans-serif" font-size="11" letter-spacing="1.5">SIGNAL STRENGTH</text>
  <text x="830" y="246" fill="#FFFFFF" font-family="monospace" font-size="32" font-weight="600">-44.8 dBm</text>

  <text x="830" y="298" fill="#777777" font-family="sans-serif" font-size="11" letter-spacing="1.5">NETWORK QUALITY INDEX</text>
  <text x="830" y="334" fill="#FFFFFF" font-family="monospace" font-size="28" font-weight="600">98.4%</text>

  <!-- Waveform Graph -->
  <text x="830" y="390" fill="#777777" font-family="monospace" font-size="11" letter-spacing="1.5">LATENCY &amp; THROUGHPUT TRACE</text>
  <polyline points="830,465 860,445 890,452 920,425 950,435 980,412 1010,420 1040,400 1070,415 1100,395 1124,402" fill="none" stroke="#FFFFFF" stroke-width="1.75"/>
  <line x1="830" y1="485" x2="1124" y2="485" stroke="#222222" stroke-width="1"/>
  <text x="830" y="510" fill="#777777" font-family="monospace" font-size="11">KOTLIN TELEMETRY AGENT • MONGODB ATLAS</text>

  <!-- Bottom Metrics Strip -->
  <rect x="48" y="560" width="352" height="112" fill="#111111" stroke="#222222" stroke-width="1"/>
  <text x="76" y="596" fill="#777777" font-family="monospace" font-size="11" letter-spacing="1.5">STACK ARCHITECTURE</text>
  <text x="76" y="630" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="500">Next.js + TypeScript + Express</text>
  <text x="76" y="652" fill="#777777" font-family="monospace" font-size="11">REST Ingestion Pipeline</text>

  <rect x="424" y="560" width="354" height="112" fill="#111111" stroke="#222222" stroke-width="1"/>
  <text x="452" y="596" fill="#777777" font-family="monospace" font-size="11" letter-spacing="1.5">MOBILE COLLECTOR</text>
  <text x="452" y="630" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="500">Android Native (Kotlin)</text>
  <text x="452" y="652" fill="#777777" font-family="monospace" font-size="11">Real-Time RSSI &amp; BSSID Scanning</text>

  <rect x="802" y="560" width="350" height="112" fill="#111111" stroke="#222222" stroke-width="1"/>
  <text x="830" y="596" fill="#777777" font-family="monospace" font-size="11" letter-spacing="1.5">STORAGE ENGINE</text>
  <text x="830" y="630" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="500">MongoDB Time-Series</text>
  <text x="830" y="652" fill="#777777" font-family="monospace" font-size="11">Aggregated Signal Observations</text>
</svg>
